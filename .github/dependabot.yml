# Tells us when a library or a GitHub Action we use has a newer version,
# security fixes first. It opens pull requests; nothing merges by itself.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: [ "androidx.*" ]
      kotlin:
        patterns: [ "org.jetbrains.kotlin*", "com.google.devtools.ksp*" ]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
