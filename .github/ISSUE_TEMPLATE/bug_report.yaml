name: Bug Report
description: Report a bug in Whisper
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        **Before you submit**
        - Issues are for bugs and feature requests. For questions, start a [discussion](https://github.com/Nyancat-Labs/whisper_feed/discussions) or email hej@nyancatlabs.com.
        - Please search [open](https://github.com/Nyancat-Labs/whisper_feed/issues) and [closed](https://github.com/Nyancat-Labs/whisper_feed/issues?q=is%3Aissue+is%3Aclosed) issues first.
  - type: checkboxes
    attributes:
      label: Guidelines
      description: Please ensure you've completed all of the following.
      options:
        - label: I have searched the [open](https://github.com/Nyancat-Labs/whisper_feed/issues) and [closed](https://github.com/Nyancat-Labs/whisper_feed/issues?q=is%3Aissue+is%3Aclosed) issues for one like this, without success.
          required: true
        - label: I'm on the latest version.
          required: true
        - label: I'm not using a test build (alpha/beta/release-candidate).
          required: true
        - label: This issue contains only one bug.
          required: true
  - type: textarea
    attributes:
      label: Describe the bug
      description: 'Steps to reproduce the behavior:'
      placeholder: |
          1. Go to '...'
          2. Click on '....'
          3. Scroll down to '....'
          4. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    attributes:
      label: Whisper version
      description: Settings → About shows it (for example 1.0.6).
      placeholder: 1.0.6
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation Source
      description: Where did you install Whisper from?
      options:
        - Google Play
        - F-Droid
        - GitHub releases
        - Other…
    validations:
      required: true
  - type: input
    attributes:
      label: 'Last Known Working Version'
      description: The last version of Whisper this worked on, if any.
      placeholder: 1.0.0
  - type: textarea
    attributes:
      label: Relevant information
      description: |
        Anything else that helps: screenshots, the feed's address, or a diagnostics report (Settings → Export diagnostics).
      value: |
        - Device:
        - Android Version:
        - ROM: (Pixel, One UI, HyperOS, GrapheneOS…)
        - Launcher, if you use Whisper beside your home screen: (Lawnchair…)
  - type: markdown
    attributes:
      value: |
        **Thanks for making us aware of the bug!**
