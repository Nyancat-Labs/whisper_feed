name: Feature request
description: Suggest an idea for Whisper
title: "[Feature Request] "
body:
  - type: markdown
    attributes:
      value: |
        **Before you submit**
        - Issues are for bugs and feature requests. For questions, start a [discussion](https://github.com/Nyancat-Labs/whisper_feed/discussions) or email hej@nyancatlabs.com.
        - Please search [open](https://github.com/Nyancat-Labs/whisper_feed/issues) and [closed](https://github.com/Nyancat-Labs/whisper_feed/issues?q=is%3Aissue+is%3Aclosed) issues first.
  - type: checkboxes
    attributes:
      label: Guidelines
      description: Please ensure you've completed all of the following.
      options:
          - label: I have searched the [open](https://github.com/Nyancat-Labs/whisper_feed/issues) and [closed](https://github.com/Nyancat-Labs/whisper_feed/issues?q=is%3Aissue+is%3Aclosed) issues for one like this, without success.
            required: true
          - label: I'm on the latest version.
            required: true
          - label: I'm not using a test build (alpha/beta/release-candidate).
            required: true
          - label: This issue contains only one feature request.
            required: true
  - type: textarea
    attributes:
      label: Problem Description
      description: Please add a clear and concise description of the problem you are seeking to solve with this feature request.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant information
      description: |
        Feel free to add any other context or media about the feature request here.
      value: |
        - Whisper version:
        - Device:
        - Android Version:
        - ROM: (Pixel, One UI, HyperOS, GrapheneOS…)
        - Launcher, if you use Whisper beside your home screen: (Lawnchair…)
  - type: markdown
    attributes:
      value: |
        **Thanks for contributing ideas!**
